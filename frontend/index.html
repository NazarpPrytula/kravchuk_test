<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DotaStats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <style>
     .outlined-text {
      color: rgb(255, 255, 255); 
      text-shadow:
      -1px -1px 0 black,
      1px -1px 0 black,
      -1px  1px 0 black,
      1px  1px 0 black; 
      }
    </style >
    <h1 class="logo">DotaStats</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Heroes</a>
      <a href="#">Statistics</a>
      <a href="#">About</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h2>Welcome to DotaStats</h2>
      <p>Your source for detailed Dota 2 hero statistics and analytics</p>
    </section>

    <section>
      <h3>Popular Heroes</h3>
      <div id="popular-heroes" class="cards">Loading popular heroes...</div>
    </section>

    <section>
      <h3>Hero Statistics</h3>
      <div class="grid">
        <div class="card" id="highest-win-rate">Loading statistics...</div>
        <div class="card" id="most-picked">Loading statistics...</div>
        <div class="card" id="best-counter-picks">Loading statistics...</div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
